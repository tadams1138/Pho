# Compose file format 3.7 is the highest supported by docker-compose v1.24.1,
# so the same file works with both legacy `docker-compose` and modern `docker compose`.
version: "3.7"

services:
  app:
    build: .
    image: pho
    ports:
      # Host port is configurable (install.sh writes .env); container ports stay 8931/8932.
      - "${PHO_ADMIN_PORT:-8931}:8931"   # admin UI
      - "${PHO_MOCK_PORT:-8932}:8932"    # mock-serving surface
    environment:
      - ConnectionStrings__Pho=Data Source=/data/pho.db
      # Sub-path the admin UI is reached through, when a reverse proxy mounts it under one
      # (e.g. PHO_PATH_BASE=/Pho/admin). Empty means served at a host root. Only needed for a proxy
      # that does not send X-Forwarded-Prefix — IIS URL Rewrite, for one, does not.
      - Pho__PathBase=${PHO_PATH_BASE:-}
    volumes:
      - pho-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8931/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pho-data:
