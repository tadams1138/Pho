services:
  app:
    build: .
    image: pho
    ports:
      # Host port is configurable (install.sh writes .env); container ports stay 8931/8932.
      - "${PHO_ADMIN_PORT:-8931}:8931"   # admin UI
      - "${PHO_MOCK_PORT:-8932}:8932"    # mock-serving surface
    environment:
      - ConnectionStrings__Pho=Data Source=/data/pho.db
    volumes:
      - pho-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8931/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pho-data:
